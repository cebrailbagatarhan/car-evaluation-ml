name: Batch input preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_validate_prediction_input.py' -v
      - name: Check committed sample inputs
        run: |
          python validate_prediction_input.py sample_input.csv --format json
          python validate_prediction_input.py sample_input.json --format json
