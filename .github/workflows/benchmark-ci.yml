name: Test encoding benchmark

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused unit tests
        run: python -m unittest -v tests.test_encoding_benchmark

      - name: Run quick nested-CV smoke test
        run: |
          python encoding_benchmark.py \
            --outer-folds 3 \
            --inner-folds 2 \
            --quick \
            --n-jobs 1 \
            --output-dir benchmark-smoke
